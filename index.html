<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冰烁Studio</title>
  <style>
    /* 全局变量 - 黑科技+二次元适配风格 */
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0c;
      --bg-card: #121216;
      --grid-base-color: rgba(14, 207, 126, 0.06); /* 绿色网格，呼应需求 */
      --grid-active-color: rgba(14, 207, 126, 0.3); /* 鼠标悬浮网格高亮色 */
      --accent-main: #0ecf7e; /* 主点缀绿 */
      --accent-light: rgba(14, 207, 126, 0.4);
      --accent-secondary: #1677ff; /* 辅助冰蓝 */
      --text-white: #f5f5f5;
      --text-gray: #aaaaaa;
      --border-color: rgba(14, 207, 126, 0.2);
      --shadow-normal: 0 2px 15px rgba(0, 0, 0, 0.7);
      --shadow-hover: 0 0 30px var(--accent-light);
      --grid-size: 40px; /* 网格基础大小 */
    }

    /* 动态方块动画 - 从右到左 */
    @keyframes floatLeft {
      0% {
        transform: translateX(100vw) translateY(0);
        opacity: 0;
      }
      5% {
        opacity: 1;
      }
      95% {
        opacity: 1;
      }
      100% {
        transform: translateX(-100px) translateY(0);
        opacity: 0;
      }
    }

    /* 动态方块动画 - 从左到右 */
    @keyframes floatRight {
      0% {
        transform: translateX(-100px) translateY(0);
        opacity: 0;
      }
      5% {
        opacity: 1;
      }
      95% {
        opacity: 1;
      }
      100% {
        transform: translateX(100vw) translateY(0);
        opacity: 0;
      }
    }

    /* 粒子动画 */
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: scale(1) translate(0, 0);
      }
      100% {
        opacity: 0;
        transform: scale(0) translate(var(--particle-x, 10px), var(--particle-y, 10px));
      }
    }

    /* 渐变动画 */
    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* 打字动画 */
    @keyframes typing {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }

    /* 进场动画 - 上移淡入 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 按钮悬停效果 */
    .tab-btn:hover span:last-child {
      left: 100%;
    }

    /* 欢迎文案容器 */
    .welcome-content {
      text-align: center;
    }

    /* 打字效果容器 */
    .welcome-title {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid var(--accent-main);
      animation: blink-caret 0.75s step-end infinite;
    }

    /* 光标闪烁动画 */
    @keyframes blink-caret {
      from, to {
        border-color: transparent;
      }
      50% {
        border-color: var(--accent-main);
      }
    }

    /* 缩放动画 */
    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    /* 左移淡入动画 */
    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 右移淡入动画 */
    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 卡片进场动画 */
    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 为所有卡片添加进场动画 */
    .code-card, .game-card, .tool-card {
      opacity: 0;
      animation: cardIn 0.6s ease-out forwards;
    }

    /* 为每个卡片设置不同的动画延迟 */
    .code-card:nth-child(1), .game-card:nth-child(1), .tool-card:nth-child(1) {
      animation-delay: 0.2s;
    }

    .code-card:nth-child(2), .game-card:nth-child(2), .tool-card:nth-child(2) {
      animation-delay: 0.4s;
    }

    .code-card:nth-child(3), .game-card:nth-child(3), .tool-card:nth-child(3) {
      animation-delay: 0.6s;
    }

    .code-card:nth-child(4), .game-card:nth-child(4), .tool-card:nth-child(4) {
      animation-delay: 0.8s;
    }

    /* 底部进场动画 */
    .footer {
      opacity: 0;
      animation: fadeInUp 1s ease-out 2.5s forwards;
    }

    /* 动态方块容器 */
    .floating-blocks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    /* 动态方块样式 - 基础样式 */
    .floating-block {
      position: absolute;
      animation: floatLeft linear infinite;
      box-shadow: 0 4px 16px rgba(14, 207, 126, 0.3);
      backdrop-filter: blur(5px);
      opacity: 0.7;
    }

    /* 不同形状 */
    .shape-square {
      border-radius: 0;
    }

    .shape-rounded {
      border-radius: 8px;
    }

    .shape-circle {
      border-radius: 50%;
    }

    .shape-custom {
      border-radius: 12px 0 12px 0;
    }

    /* 不同颜色方案 */
    .color-green {
      background: linear-gradient(135deg, var(--accent-main), rgba(14, 207, 126, 0.6));
    }

    .color-blue {
      background: linear-gradient(135deg, var(--accent-secondary), rgba(22, 119, 255, 0.6));
    }

    .color-purple {
      background: linear-gradient(135deg, #722ed1, rgba(114, 46, 209, 0.6));
    }

    .color-orange {
      background: linear-gradient(135deg, #fa8c16, rgba(250, 140, 22, 0.6));
    }

    .color-random {
      /* 随机色将通过JavaScript动态生成 */
    }

    /* 粒子样式 */
    .particle {
      position: absolute;
      width: var(--particle-size, 4px);
      height: var(--particle-size, 4px);
      background-color: var(--particle-color, var(--accent-main));
      border-radius: 50%;
      pointer-events: none;
      animation: particleFloat var(--particle-duration, 1s) ease-out forwards;
      z-index: 2;
    }

    /* 不同大小和速度的方块 - 扩展范围 */
    .block-1 {
      width: 10px;
      height: 10px;
      animation-duration: 6s;
    }

    .block-2 {
      width: 15px;
      height: 15px;
      animation-duration: 8s;
    }

    .block-3 {
      width: 20px;
      height: 20px;
      animation-duration: 10s;
    }

    .block-4 {
      width: 25px;
      height: 25px;
      animation-duration: 12s;
    }

    .block-5 {
      width: 30px;
      height: 30px;
      animation-duration: 14s;
    }

    .block-6 {
      width: 40px;
      height: 40px;
      animation-duration: 16s;
    }

    /* 全局重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "微软雅黑", monospace, "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-white);
      min-height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
      position: relative;
    }

    /* 核心：动态网格容器 - 随鼠标反应 */
    .grid-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* 不遮挡其他元素点击 */
      z-index: 1;
      /* 基础网格 */
      background-image:
        linear-gradient(var(--grid-base-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-base-color) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      transition: background-position 0.05s ease-out; /* 只保留位置过渡，移除缩放过渡 */
      transform: scale(1); /* 固定缩放比例 */
      transform-origin: center;
      /* 确保网格始终覆盖整个屏幕 */
      min-width: 100vw;
      min-height: 100vh;
    }

    /* 顶部标签导航 - 增强交互 */
    .tab-nav {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      position: relative;
      z-index: 100;
    }

    .tab-btn {
      padding: 12px 28px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-gray);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      background-color: var(--bg-card);
      color: var(--accent-main);
      border-color: var(--accent-main);
      border-bottom: 2px solid var(--accent-main);
      box-shadow: var(--shadow-normal);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-white);
      border-color: var(--grid-active-color);
      transform: translateY(-2px);
    }

    /* 主内容容器 */
    .content-container {
      max-width: 1200px;
      margin: 30px auto 80px;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    /* 标签页内容 - 平滑切换动画 */
    .tab-content {
      display: none;
      padding: 30px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow-normal);
      /* 内容区细网格 */
      background-image:
        linear-gradient(var(--grid-base-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-base-color) 1px, transparent 1px);
      background-size: 25px 25px;
      min-height: 600px;
    }

    .tab-content.active {
      display: block;
      animation: contentFadeIn 0.5s ease-in-out;
    }

    @keyframes contentFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 1. 冰烁Studio首页 - logo.png 核心展示 */
    .home-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 30px;
      height: 100%;
    }

    /* logo 容器 - 精准适配 logo.png */
    .logo-container {
      width: 180px; /* 可调整，适配logo大小 */
      height: 180px;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid var(--accent-main);
      box-shadow: var(--shadow-hover);
      transition: all 0.8s ease;
      position: relative;
    }

    .logo-container:hover {
      transform: rotate(5deg) scale(1.05);
      box-shadow: 0 0 40px var(--accent-light);
    }

    /* logo.png 展示 - 用户直接替换该文件即可 */
    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-name {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--text-white), var(--accent-main));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: all 0.5s ease;
    }

    .brand-name:hover {
      letter-spacing: 6px;
    }

    .brand-desc {
      font-size: 14px;
      color: var(--text-gray);
      letter-spacing: 2px;
      max-width: 600px;
      margin-top: 10px;
    }

    .brand-divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-main), transparent);
      margin-top: 20px;
    }

    /* 2. 源码库板块 - 增强悬浮交互 */
    .code-library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    .code-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      box-shadow: var(--shadow-normal);
      position: relative;
    }

    .code-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: var(--accent-main);
      box-shadow: var(--shadow-hover);
    }

    .code-card-header {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    .code-icon {
      font-size: 56px;
      color: var(--text-gray);
      transition: all 0.3s ease;
    }

    .code-card:hover .code-icon {
      color: var(--accent-main);
      transform: scale(1.1) rotate(10deg);
    }

    .code-card-body {
      padding: 20px;
      text-align: center;
    }

    .code-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--text-white);
    }

    .code-desc {
      font-size: 12px;
      color: var(--text-gray);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .code-btn {
      display: inline-block;
      padding: 8px 20px;
      border: 1px solid var(--accent-main);
      border-radius: 6px;
      color: var(--accent-main);
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .code-btn:hover {
      background-color: var(--accent-main);
      color: var(--bg-primary);
      box-shadow: 0 0 15px var(--accent-light);
    }

    /* 3. 小游戏板块 - 点击新开网页，增强交互 */
    .game-library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    .game-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      box-shadow: var(--shadow-normal);
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: var(--accent-main);
      box-shadow: var(--shadow-hover);
    }

    .game-card-header {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    .game-icon {
      font-size: 56px;
      color: var(--text-gray);
      transition: all 0.3s ease;
    }

    .game-card:hover .game-icon {
      color: var(--accent-main);
      transform: scale(1.1) rotate(-10deg);
    }

    .game-card-body {
      padding: 20px;
      text-align: center;
    }

    .game-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--text-white);
    }

    .game-launch-btn {
      display: inline-block;
      padding: 8px 20px;
      background-color: var(--accent-main);
      border-radius: 6px;
      color: var(--bg-primary);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
    }

    .game-launch-btn:hover {
      background-color: #0ab86e;
      box-shadow: 0 0 15px var(--accent-light);
      transform: scale(1.05);
    }

    /* 4. 常用工具板块 */
    .tools-library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    .tool-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      box-shadow: var(--shadow-normal);
      position: relative;
    }

    .tool-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: var(--accent-main);
      box-shadow: var(--shadow-hover);
    }

    .tool-card-header {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    .tool-icon {
      font-size: 56px;
      color: var(--text-gray);
      transition: all 0.3s ease;
    }

    .tool-card:hover .tool-icon {
      color: var(--accent-main);
      transform: scale(1.1);
    }

    .tool-card-body {
      padding: 20px;
      text-align: center;
    }

    .tool-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--text-white);
    }

    .tool-btn {
      display: inline-block;
      padding: 8px 20px;
      border: 1px solid var(--accent-main);
      border-radius: 6px;
      color: var(--accent-main);
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .tool-btn:hover {
      background-color: var(--accent-main);
      color: var(--bg-primary);
      box-shadow: 0 0 15px var(--accent-light);
    }

    /* 底部 */
    .footer {
      padding: 30px 0;
      text-align: center;
      color: var(--text-gray);
      font-size: 12px;
      letter-spacing: 1px;
      position: relative;
      z-index: 10;
      opacity: 0.7;
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .tab-nav {
        flex-wrap: wrap;
        gap: 6px;
      }

      .tab-btn {
        padding: 10px 20px;
        font-size: 14px;
      }

      .brand-name {
        font-size: 36px;
      }

      .logo-container {
        width: 150px;
        height: 150px;
      }

      .code-library, .game-library, .tools-library {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
      }

      .tab-content {
        min-height: 500px;
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .code-library, .game-library, .tools-library {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .brand-name {
        font-size: 28px;
      }

      .logo-container {
        width: 120px;
        height: 120px;
      }

      .tab-btn {
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
<!-- 核心：动态网格容器 - 随鼠标反应 -->
<div class="grid-container" id="dynamicGrid"></div>

<!-- 动态方块容器 -->
<div class="floating-blocks" id="floatingBlocks"></div>

<!-- 左上角logo和名字 -->
<div style="position: fixed; top: 20px; left: 20px; z-index: 1000; display: flex; align-items: center; gap: 12px; opacity: 0; animation: fadeInUp 1s ease-out 0.2s forwards;">
  <div class="logo-container" style="width: 60px; height: 60px; border-radius: 12px; transform: scale(0); animation: scaleIn 0.5s ease-out 0.5s forwards;">
    <img src="logo.png" alt="冰烁Studio二次元logo" class="brand-logo-img">
  </div>
  <div class="brand-name" style="font-size: 24px; letter-spacing: 2px; opacity: 0; animation: fadeInLeft 0.5s ease-out 0.7s forwards;">冰烁Studio</div>
</div>

<!-- 顶部标签导航 - 调整位置 -->
<div class="tab-nav" style="margin-top: 100px; opacity: 0; animation: fadeInUp 1s ease-out 1s forwards;">
  <button class="tab-btn" data-tab="home" style="opacity: 0; animation: fadeInUp 0.5s ease-out 1.2s forwards;">首页</button>
  <button class="tab-btn" data-tab="code" style="opacity: 0; animation: fadeInUp 0.5s ease-out 1.3s forwards;">源码库</button>
  <button class="tab-btn active" data-tab="game" style="opacity: 0; animation: fadeInUp 0.5s ease-out 1.4s forwards;">小游戏</button>
  <button class="tab-btn" data-tab="tool" style="opacity: 0; animation: fadeInUp 0.5s ease-out 1.5s forwards;">常用工具</button>
</div>

<!-- 主内容容器 -->
<div class="content-container">
  <!-- 1. 冰烁Studio首页 - 欢迎文案 -->
  <div class="tab-content active" id="home">
    <div class="home-page" style="position: relative; justify-content: center; align-items: center; min-height: 600px; overflow: hidden;">
      <!-- 射击小游戏容器 -->
      <div id="shootingGame" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;">
        <canvas id="gameCanvas" style="width: 100%; height: 100%;"></canvas>
        <div id="gameScore" style="position: absolute; top: 10px; right: 10px; color: white; font-size: 18px; font-weight: bold; z-index: 2;">Score: 0</div>
        <div id="gameInstructions" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: white; font-size: 14px; z-index: 2; text-align: center;">使用鼠标移动飞船，点击鼠标左键射击</div>
      </div>

      <!-- 欢迎文案容器 -->
      <div class="welcome-content" style="position: relative; z-index: 10; text-align: center; opacity: 0; animation: fadeInUp 1s ease-out 0.5s forwards;">

<script>
  // 核心功能1：生成动态飞行方块（增强版）
  function createFloatingBlocks() {
    const floatingBlocksContainer = document.getElementById('floatingBlocks');
    const blockTypes = ['block-1', 'block-2', 'block-3', 'block-4', 'block-5', 'block-6'];
    const shapes = ['shape-square', 'shape-rounded', 'shape-circle', 'shape-custom'];
    const colors = ['color-green', 'color-blue', 'color-purple', 'color-orange', 'color-random'];
    const blockCount = 20; // 增加方块数量

    // 清空容器
    floatingBlocksContainer.innerHTML = '';

    // 生成多个方块
    for (let i = 0; i < blockCount; i++) {
      const block = document.createElement('div');

      // 随机选择方块类型
      const blockType = blockTypes[Math.floor(Math.random() * blockTypes.length)];

      // 随机选择形状
      const shape = shapes[Math.floor(Math.random() * shapes.length)];

      // 随机选择颜色
      const color = colors[Math.floor(Math.random() * colors.length)];

      // 随机选择方向
      const direction = Math.random() > 0.5 ? 'floatLeft' : 'floatRight';

      // 设置方块类名
      block.className = `floating-block ${blockType} ${shape} ${color}`;

      // 设置动画方向
      block.style.animationName = direction;

      // 随机垂直位置
      const topPosition = Math.random() * (window.innerHeight - 60);
      block.style.top = `${topPosition}px`;

      // 随机初始延迟，避免同时出现
      const delay = Math.random() * 5;
      block.style.animationDelay = `${delay}s`;

      // 随机生成颜色（如果选择了随机色）
      if (color === 'color-random') {
        const randomColor1 = `hsl(${Math.random() * 360}, 70%, 60%)`;
        const randomColor2 = `hsl(${Math.random() * 360}, 70%, 60%)`;
        block.style.background = `linear-gradient(135deg, ${randomColor1}, ${randomColor2})`;
      }

      // 添加到容器
      floatingBlocksContainer.appendChild(block);

      // 为方块添加拖尾粒子效果
      addBlockParticles(block);
    }
  }

  // 为方块添加拖尾粒子
  function addBlockParticles(block) {
    const particleCount = 3 + Math.floor(Math.random() * 3); // 3-5个粒子

    // 定期生成粒子
    const particleInterval = setInterval(() => {
      // 检查方块是否还存在
      if (!block.parentElement) {
        clearInterval(particleInterval);
        return;
      }

      // 生成粒子
      for (let i = 0; i < particleCount; i++) {
        createParticle(block);
      }
    }, 200); // 每200ms生成一次粒子
  }

  // 创建单个粒子
  function createParticle(parentBlock) {
    const particle = document.createElement('div');
    particle.className = 'particle';

    // 设置随机粒子大小
    const particleSize = 2 + Math.random() * 4;
    particle.style.setProperty('--particle-size', `${particleSize}px`);

    // 从父方块获取颜色
    const parentColor = window.getComputedStyle(parentBlock).backgroundImage;
    const colorMatch = parentColor.match(/hsl\(([^)]+)\)/) || parentColor.match(/rgb\(([^)]+)\)/);

    if (colorMatch) {
      particle.style.setProperty('--particle-color', colorMatch[0]);
    } else {
      // 默认颜色
      particle.style.setProperty('--particle-color', 'var(--accent-main)');
    }

    // 设置随机粒子移动方向和距离
    const particleX = (Math.random() - 0.5) * 20;
    const particleY = (Math.random() - 0.5) * 20;
    particle.style.setProperty('--particle-x', `${particleX}px`);
    particle.style.setProperty('--particle-y', `${particleY}px`);

    // 设置随机粒子动画持续时间
    const duration = 0.5 + Math.random() * 1;
    particle.style.setProperty('--particle-duration', `${duration}s`);

    // 设置粒子位置（在方块内部随机位置）
    const blockRect = parentBlock.getBoundingClientRect();
    const particleLeft = Math.random() * blockRect.width;
    const particleTop = Math.random() * blockRect.height;

    particle.style.left = `${particleLeft}px`;
    particle.style.top = `${particleTop}px`;

    // 添加到父方块
    parentBlock.appendChild(particle);

    // 粒子动画结束后移除
    particle.addEventListener('animationend', () => {
      particle.remove();
    });
  }

  // 生成随机背景粒子
  function createBackgroundParticles() {
    const particleCount = 50;
    const floatingBlocksContainer = document.getElementById('floatingBlocks');

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';

      // 随机大小
      const size = 1 + Math.random() * 3;
      particle.style.setProperty('--particle-size', `${size}px`);

      // 随机颜色
      const color = `hsl(${Math.random() * 360}, 70%, 60%)`;
      particle.style.setProperty('--particle-color', color);

      // 随机位置
      particle.style.left = `${Math.random() * window.innerWidth}px`;
      particle.style.top = `${Math.random() * window.innerHeight}px`;

      // 随机动画参数
      const duration = 2 + Math.random() * 3;
      particle.style.setProperty('--particle-duration', `${duration}s`);

      const x = (Math.random() - 0.5) * 100;
      const y = (Math.random() - 0.5) * 100;
      particle.style.setProperty('--particle-x', `${x}px`);
      particle.style.setProperty('--particle-y', `${y}px`);

      // 直接添加到容器
      floatingBlocksContainer.appendChild(particle);

      // 动画结束后移除
      particle.addEventListener('animationend', () => {
        particle.remove();
      });
    }
  }

  // 核心功能2：动态网格 - 随鼠标位置反应（增强版）
  const dynamicGrid = document.getElementById('dynamicGrid');
  const gridSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-size'));

  // 鼠标位置平滑插值变量
  let currentMouseX = 0;
  let currentMouseY = 0;
  let targetMouseX = 0;
  let targetMouseY = 0;
  const smoothingFactor = 0.1; // 平滑因子，值越小越平滑

  // 监听鼠标移动事件
  document.addEventListener('mousemove', (e) => {
    // 更新目标位置
    targetMouseX = e.clientX;
    targetMouseY = e.clientY;
  });

  // 使用requestAnimationFrame实现平滑动画
  function updateGrid() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;

    // 平滑插值计算当前位置
    currentMouseX += (targetMouseX - currentMouseX) * smoothingFactor;
    currentMouseY += (targetMouseY - currentMouseY) * smoothingFactor;

    // 计算网格偏移量 - 随鼠标移动平滑偏移
    const offsetX = (currentMouseX / windowWidth) * gridSize * 3 - gridSize * 1.5;
    const offsetY = (currentMouseY / windowHeight) * gridSize * 3 - gridSize * 1.5;

    // 设置网格背景位置 - 实现跟随效果
    dynamicGrid.style.backgroundPosition = `${offsetX}px ${offsetY}px`;

    // 计算鼠标周围网格高亮，扩大范围到200px
    const highlightRadius = 200; // 高亮范围扩大
    const distanceFromMouse = Math.sqrt(
      Math.pow(currentMouseX - windowWidth / 2, 2) +
      Math.pow(currentMouseY - windowHeight / 2, 2)
    );

    // 根据鼠标位置调整网格颜色深浅，增强对比度
    const opacity = Math.min(1, distanceFromMouse / windowWidth * 2);
    const gridOpacity = 0.06 + Math.min(0.3, (1 - opacity) * 0.4); // 增强高亮效果
    const gridActiveColor = `rgba(14, 207, 126, ${gridOpacity})`;

    // 更新网格背景
    dynamicGrid.style.backgroundImage = `
                linear-gradient(${gridActiveColor} 1px, transparent 1px),
                linear-gradient(90deg, ${gridActiveColor} 1px, transparent 1px)
            `;

    // 移除网格缩放效果，保持全屏显示
    dynamicGrid.style.transform = 'scale(1)';
    // 确保网格始终覆盖整个屏幕
    dynamicGrid.style.width = '100vw';
    dynamicGrid.style.height = '100vh';

    // 继续下一帧动画
    requestAnimationFrame(updateGrid);
  }

  // 启动网格动画
  updateGrid();

  // 核心功能2：标签页切换逻辑
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');
  const shootingGame = document.getElementById('shootingGame');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      // 移除所有激活状态
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));

      // 添加当前激活状态
      btn.classList.add('active');
      const tabId = btn.getAttribute('data-tab');
      document.getElementById(tabId).classList.add('active');

      // 控制射击游戏显示/隐藏
      if (tabId === 'home') {
        shootingGame.style.display = 'block';
      } else {
        shootingGame.style.display = 'none';
      }
    });
  });

  // 核心功能3：卡片点击辅助 - 任意位置触发按钮
  // 源码卡片
  const codeCards = document.querySelectorAll('.code-card');
  codeCards.forEach(card => {
    const codeBtn = card.querySelector('.code-btn');
    card.addEventListener('click', (e) => {
      if (e.target !== codeBtn) {
        codeBtn.click();
      }
    });
  });

  // 游戏卡片
  const gameCards = document.querySelectorAll('.game-card');
  gameCards.forEach(card => {
    const gameBtn = card.querySelector('.game-launch-btn');
    card.addEventListener('click', (e) => {
      if (e.target !== gameBtn) {
        gameBtn.click();
      }
    });
  });

  // 工具卡片
  const toolCards = document.querySelectorAll('.tool-card');
  toolCards.forEach(card => {
    const toolBtn = card.querySelector('.tool-btn');
    card.addEventListener('click', (e) => {
      if (e.target !== toolBtn) {
        toolBtn.click();
      }
    });
  });

  // 窗口大小变化时，重置网格样式和重新生成方块
  window.addEventListener('resize', () => {
    dynamicGrid.style.backgroundSize = `${gridSize}px ${gridSize}px`;
    // 重新生成方块，适应新窗口大小
    createFloatingBlocks();
  });

  // 页面加载时生成动态方块和背景粒子
  window.addEventListener('load', () => {
    createFloatingBlocks();
    // 生成背景粒子
    createBackgroundParticles();
    // 定期更新背景粒子
    setInterval(createBackgroundParticles, 5000); // 每5秒生成一次新的背景粒子

    // 初始化射击小游戏
    initShootingGame();
  });

  // 射击小游戏实现
  function initShootingGame() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('gameScore');

    // 设置canvas尺寸
    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 游戏对象
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      width: 40,
      height: 30,
      speed: 5,
      color: '#0ecf7e',
      bullets: []
    };

    const enemies = [];
    const particles = [];
    let score = 0;
    let enemySpawnTimer = 0;
    const enemySpawnInterval = 60; // 每60帧生成一个敌人

    // 鼠标位置
    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;

    // 监听鼠标移动
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    // 监听鼠标点击
    canvas.addEventListener('click', () => {
      player.bullets.push({
        x: player.x + player.width / 2 - 2.5,
        y: player.y,
        width: 5,
        height: 10,
        speed: 8,
        color: '#1677ff'
      });
    });

    // 绘制玩家飞船
    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // 绘制飞船中心发光效果
      ctx.fillStyle = 'rgba(14, 207, 126, 0.5)';
      ctx.beginPath();
      ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width / 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绘制敌人
    function drawEnemies() {
      enemies.forEach(enemy => {
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

        // 敌人发光效果
        ctx.fillStyle = 'rgba(250, 140, 22, 0.3)';
        ctx.fillRect(enemy.x - 5, enemy.y - 5, enemy.width + 10, enemy.height + 10);
      });
    }

    // 绘制子弹
    function drawBullets() {
      player.bullets.forEach(bullet => {
        ctx.fillStyle = bullet.color;
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

        // 子弹发光效果
        ctx.fillStyle = 'rgba(22, 119, 255, 0.5)';
        ctx.fillRect(bullet.x - 2, bullet.y - 2, bullet.width + 4, bullet.height + 4);
      });
    }

    // 绘制粒子
    function drawParticles() {
      particles.forEach(particle => {
        ctx.fillStyle = particle.color;
        ctx.globalAlpha = particle.alpha;
        ctx.fillRect(particle.x, particle.y, particle.width, particle.height);
        ctx.globalAlpha = 1;
      });
    }

    // 更新玩家位置
    function updatePlayer() {
      // 平滑跟随鼠标
      player.x += (mouseX - (player.x + player.width / 2)) * 0.1;
      player.y += (mouseY - (player.y + player.height / 2)) * 0.1;

      // 边界检测
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
      if (player.y < 0) player.y = 0;
      if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
    }

    // 更新敌人
    function updateEnemies() {
      enemies.forEach((enemy, index) => {
        enemy.y += enemy.speed;

        // 敌人超出屏幕底部
        if (enemy.y > canvas.height) {
          enemies.splice(index, 1);
        }
      });

      // 生成新敌人
      enemySpawnTimer++;
      if (enemySpawnTimer >= enemySpawnInterval) {
        enemies.push({
          x: Math.random() * (canvas.width - 30),
          y: -30,
          width: 30,
          height: 30,
          speed: 2 + Math.random() * 2,
          color: '#fa8c16'
        });
        enemySpawnTimer = 0;
      }
    }

    // 更新子弹
    function updateBullets() {
      player.bullets.forEach((bullet, bulletIndex) => {
        bullet.y -= bullet.speed;

        // 子弹超出屏幕顶部
        if (bullet.y < 0) {
          player.bullets.splice(bulletIndex, 1);
          return;
        }

        // 子弹与敌人碰撞检测
        enemies.forEach((enemy, enemyIndex) => {
          if (
            bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y
          ) {
            // 生成爆炸粒子
            for (let i = 0; i < 8; i++) {
              particles.push({
                x: enemy.x + enemy.width / 2,
                y: enemy.y + enemy.height / 2,
                width: 4 + Math.random() * 6,
                height: 4 + Math.random() * 6,
                speedX: (Math.random() - 0.5) * 10,
                speedY: (Math.random() - 0.5) * 10,
                color: `hsl(${Math.random() * 60 + 30}, 70%, 60%)`,
                alpha: 1,
                life: 30
              });
            }

            // 移除敌人和子弹
            enemies.splice(enemyIndex, 1);
            player.bullets.splice(bulletIndex, 1);

            // 增加分数
            score += 10;
            scoreElement.textContent = `Score: ${score}`;
          }
        });
      });
    }

    // 更新粒子
    function updateParticles() {
      particles.forEach((particle, index) => {
        particle.x += particle.speedX;
        particle.y += particle.speedY;
        particle.alpha -= 0.03;
        particle.life--;

        if (particle.life <= 0 || particle.alpha <= 0) {
          particles.splice(index, 1);
        }
      });
    }

    // 游戏主循环
    function gameLoop() {
      // 清空画布
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 更新游戏对象
      updatePlayer();
      updateEnemies();
      updateBullets();
      updateParticles();

      // 绘制游戏对象
      drawPlayer();
      drawEnemies();
      drawBullets();
      drawParticles();

      // 继续下一个帧
      requestAnimationFrame(gameLoop);
    }

    // 启动游戏循环
    gameLoop();
  }
</script>
